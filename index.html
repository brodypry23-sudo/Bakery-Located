<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Bakery Located</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css"> 
</head>
<body>

    <!--<header and navigation>-->
    <span id="navbar-placeholder"></span>
    <script>
        fetch('navbar.html')    
        .then(response => response.text())    
        .then(html => { document.getElementById('navbar-placeholder').innerHTML = html; });
    </script>
    <!--<end header and navigation>-->

    <main>
    <!--<section class="hero-section">-->
        <section class="hero-section">
            <div class="section-content">
                <div>
                    <h1>Welcome to Bakery Located</h1>
                    <h2>Discover the Best Bakeries</h2>
                    <p>Explore our curated list of bakeries, each offering unique flavors and experiences. From traditional pastries to modern fusion creations, find your next favorite bakery here.</p>
                    <div class="hero-buttons">
                        <a href="Locations.html" class="btn btn-primary hero-button">Explore Locations</a>
                        <a href="gallery.html" class="btn btn-secondary hero-button">View Gallery</a>
                    </div>
                </div>
                <div class="hero-image-wrap">
                    <img src="img/bread.png" alt="bread" class="hero-image">
                </div>
            </div>
        </section>
    <!---<end section class="hero-section">-->
    </main>
    


    <!--horizontal scroll-->
    <section class="carousel-section">
        <h1 class="section-title">Featured Bakerys</h1>
        <div class="carousel-container">
            <div class="group">
                <div class="card"><img src="https://www.datocms-assets.com/166413/1776228464-sourdough-bread-display-bakery-south-yarra-melbourne.jpg?fm=avif&w=1164&h=926" alt="Bakery 1"></div>
                <div class="card"><img src="https://media.timeout.com/images/105905379/1920/1080/image.webp" alt="Bakery 2"></div>
                <div class="card"><img src="https://www.rollingpin.com.au/wp-content/uploads/2019/10/one.jpg" alt="Bakery 3"></div>
                <div class="card"><img src="https://www.bordermail.com.au/images/transform/v1/crop/frm/beau.greenway/104e787c-fb59-40ac-b725-907b7bc3872f.jpg/r0_0_5071_3381_w1200_h678_fmax.webp" alt="Bakery 4"></div>
                <div class="card"><img src="https://media2.architecturemedia.net/site_media/media/cache/09/ef/09efac680c77e774257e079f7258b365.jpg" alt="Bakery 5"></div>
                <div class="card"><img src="https://woodfrogbakery.com.au/images/slider2/woodfrog-bakery_brighton2.jpeg" alt="Bakery 6"></div>
            </div>
            <div aria-hidden="true" class="group">
                <div class="card"><img src="https://www.datocms-assets.com/166413/1776228464-sourdough-bread-display-bakery-south-yarra-melbourne.jpg?fm=avif&w=1164&h=926" alt="Bakery 1"></div>
                <div class="card"><img src="https://media.timeout.com/images/105905379/1920/1080/image.webp" alt="Bakery 2"></div>
                <div class="card"><img src="https://www.rollingpin.com.au/wp-content/uploads/2019/10/one.jpg" alt="Bakery 3"></div>
                <div class="card"><img src="https://www.bordermail.com.au/images/transform/v1/crop/frm/beau.greenway/104e787c-fb59-40ac-b725-907b7bc3872f.jpg/r0_0_5071_3381_w1200_h678_fmax.webp" alt="Bakery 4"></div>
                <div class="card"><img src="https://media2.architecturemedia.net/site_media/media/cache/09/ef/09efac680c77e774257e079f7258b365.jpg" alt="Bakery 5"></div>
                <div class="card"><img src="https://woodfrogbakery.com.au/images/slider2/woodfrog-bakery_brighton2.jpeg" alt="Bakery 6"></div>
            </div>
        </div>
    </section>
    <!--horizontal scroll end-->

    <!--image gallery-->
    <section class="gallery-section">
        <h1 class="section-title">Bakery Gallery</h1>
        <div class="section-content">
            <ul class="gallery-list">
                <li class="gallery-item">
                    <img src="img/1.jpg" alt="Assortment of freshly baked pastries and croissants" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/2.jpg" alt="Bakery display case filled with cakes, pastries and baked goods" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/3.jpg" alt="Fruit-topped pastries with blackberries and raspberries" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/4.jpg" alt="Freshly baked cakes and desserts displayed in a bakery cabinet" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/5.jpg" alt="Selection of colourful donuts and decorated pastries in a bakery display" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/6.jpg" alt="Freshly baked bread and pastries displayed on a bakery counter" class="gallery-image">
                </li>
            </ul>
        </div>
    </section>
    <!--image gallery end-->

    <!--< footer start >-->
    <span id="footer-placeholder"></span>
    <script>
        fetch('footer.html')    
        .then(response => response.text())    
        .then(html => { document.getElementById('footer-placeholder').innerHTML = html; });
    </script>
    <!--< footer end >-->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
