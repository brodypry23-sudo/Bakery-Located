<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Bakery Located</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css"> 
</head>
<body>

    <!--<header and navigation>-->
    <span id="navbar-placeholder"></span>
    <script>
        fetch('navbar.html')    
        .then(response => response.text())    
        .then(html => { document.getElementById('navbar-placeholder').innerHTML = html; });
    </script>
    <!--<end header and navigation>-->


    <main>
        <!--<section class="hero-section">-->
        <section class="hero-section">
            <div class="section-content">
                <div>
                    <h1>Welcome to Bakery Located</h1>
                    <h2>Discover the Best Bakeries</h2>
                    <p>Explore our curated list of bakeries, each offering unique flavors and experiences. From traditional pastries to modern fusion creations, find your next favorite bakery here.</p>
                    <div class="hero-buttons">
                        <a href="Locations.html" class="btn btn-primary hero-button">Explore Locations</a>
                        <a href="gallery.html" class="btn btn-secondary hero-button">View Gallery</a>
                    </div>
                </div>
                <div>
                    <img src="img/bread.png" alt="bread" class="hero-image">
                </div>
            </div>
        </section>
        <!---<end section class="hero-section">-->

    </main>

        <section class="gallery-section">
        <div class="section-content">
            <ul class="gallery-list">
                <li class="gallery-item">
                    <img src="img/1.jpg" alt="Assortment of freshly baked pastries and croissants" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/2.jpg" alt="Bakery display case filled with cakes, pastries and baked goods" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/3.jpg" alt="Fruit-topped pastries with blackberries and raspberries" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/4.jpg" alt="Freshly baked cakes and desserts displayed in a bakery cabinet" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/5.jpg" alt="Selection of colourful donuts and decorated pastries in a bakery display" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/6.jpg" alt="Freshly baked bread and pastries displayed on a bakery counter" class="gallery-image">
                </li>
        </div>
    </section>

    <!--< footer start >-->
    <span id="footer-placeholder"></span>
    <script>
        fetch('footer.html')    
        .then(response => response.text())    
        .then(html => { document.getElementById('footer-placeholder').innerHTML = html; });
    </script>
    <!--< footer end >-->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
