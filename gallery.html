<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Bakery Located</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css"> 
</head>
<body>

    <!--<header and navigation>-->
    <span id="navbar-placeholder"></span>
    <script>
        fetch('navbar.html')    
        .then(response => response.text())    
        .then(html => { document.getElementById('navbar-placeholder').innerHTML = html; });
    </script>
    <!--<end header and navigation>-->

    <section class="gallery-section">
        <h1 class="section-title">Gallery</h1>

        <div class="section-content">
            <ul class="gallery-list">
                <li class="gallery-item">
                    <img src="img/1.jpg" alt="Assortment of freshly baked pastries and croissants" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/2.jpg" alt="Bakery display case filled with cakes, pastries and baked goods" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/3.jpg" alt="Fruit-topped pastries with blackberries and raspberries" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/4.jpg" alt="Freshly baked cakes and desserts displayed in a bakery cabinet" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/5.jpg" alt="Selection of colourful donuts and decorated pastries in a bakery display" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/6.jpg" alt="Freshly baked bread and pastries displayed on a bakery counter" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/7.jpg" alt="Assortment of cakes and fruit-topped desserts in a bakery display" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/8.jpg" alt="Selection of decorated pastries and croissants in a bakery display" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/9.jpg" alt="Assortment of artisan bread loaves displayed with price labels" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/10.jpg" alt="Bakery display case filled with assorted pastries and desserts" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/11.jpg" alt="Large bakery display filled with assorted cakes, pastries and desserts" class="gallery-image">
                </li>
                <li class="gallery-item">
                    <img src="img/12.jpg" alt="Assortment of freshly baked croissants and pastries" class="gallery-image">
                </li>
            </ul>
        </div>
    </section>
    

    <!--< footer start >-->
    <span id="footer-placeholder"></span>
    <script>
        fetch('footer.html')    
        .then(response => response.text())    
        .then(html => { document.getElementById('footer-placeholder').innerHTML = html; });
    </script>
    <!--< footer end >-->

    <!-- Gallery zoom -->
    <script>
        const galleryImages = document.querySelectorAll(".gallery-image");

        galleryImages.forEach(image => {
            image.addEventListener("click", () => {
                image.classList.toggle("zoomed");
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
